name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o AI_Assistant_Basic.zip -d extracted

      - name: Find Gradle project
        run: |
          PROJECT=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV
          echo "Gradle project: $PROJECT"

      - name: Apply updated MainActivity
        run: |
          mkdir -p "$PROJECT/app/src/main/java/com/example/aiassistant"
          cp AI_Assistant_Basic/app/src/main/java/com/example/aiassistant/MainActivity.java \
             "$PROJECT/app/src/main/java/com/example/aiassistant/MainActivity.java"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Fix layout
        run: |
          sed -i 's/android:hintTextColor="[^"]*"//g' \
          "$PROJECT/app/src/main/res/layout/activity_main.xml"

      - name: Build APK
        run: |
          cd "$PROJECT"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Krishna-AI-Assistant-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
