name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o AI_Assistant_Basic.zip -d extracted

      - name: Find Gradle project
        run: |
          PROJECT=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV
          echo "Gradle project: $PROJECT"

      - name: Apply MainActivity
        run: |
          mkdir -p "$PROJECT/app/src/main/java/com/example/aiassistant"
          cp AI_Assistant_Basic/app/src/main/java/com/example/aiassistant/MainActivity.java \
             "$PROJECT/app/src/main/java/com/example/aiassistant/MainActivity.java"

      - name: Add Krushna AI logo
        run: |
          LOGO=$(find . -maxdepth 2 -type f -iname "*.png" | head -1)
          echo "Logo: $LOGO"

          mkdir -p "$PROJECT/app/src/main/res/drawable"
          cp "$LOGO" "$PROJECT/app/src/main/res/drawable/krushna_ai_logo.png"

      - name: Set app name and logo
        run: |
          MANIFEST="$PROJECT/app/src/main/AndroidManifest.xml"

          sed -i 's/android:label="[^"]*"/android:label="Krushna AI"/' "$MANIFEST"

          sed -i 's#android:icon="[^"]*"#android:icon="@drawable/krushna_ai_logo"#' "$MANIFEST"

          sed -i 's/android:hintTextColor="[^"]*"//g' \
          "$PROJECT/app/src/main/res/layout/activity_main.xml"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: |
          cd "$PROJECT"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Krushna-AI-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
