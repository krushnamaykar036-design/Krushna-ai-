name: Build Krushna AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Advanced Project
        run: |
          unzip -o Krishna_AI_Assistant_Advanced.zip -d extracted

      - name: Find Android Project
        run: |
          PROJECT=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs dirname)

          if [ -z "$PROJECT" ] || [ "$PROJECT" = "." ]; then
            echo "Android Gradle project not found!"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT"

      - name: Replace MainActivity
        run: |
          mkdir -p "$PROJECT/app/src/main/java/com/example/aiassistant"

          cp MainActivity.java \
            "$PROJECT/app/src/main/java/com/example/aiassistant/MainActivity.java"

      - name: Add Krushna AI Logo
        run: |
          mkdir -p "$PROJECT/app/src/main/res/drawable"

          cp file_0000000009b081fab0d7a8e0c41526ef.png \
            "$PROJECT/app/src/main/res/drawable/krushna_ai_logo.png"

      - name: Set Krushna AI App Icon
        run: |
          RES="$PROJECT/app/src/main/res"

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          cp file_0000000009b081fab0d7a8e0c41526ef.png "$RES/mipmap-mdpi/ic_launcher.png"
          cp file_0000000009b081fab0d7a8e0c41526ef.png "$RES/mipmap-hdpi/ic_launcher.png"
          cp file_0000000009b081fab0d7a8e0c41526ef.png "$RES/mipmap-xhdpi/ic_launcher.png"
          cp file_0000000009b081fab0d7a8e0c41526ef.png "$RES/mipmap-xxhdpi/ic_launcher.png"
          cp file_0000000009b081fab0d7a8e0c41526ef.png "$RES/mipmap-xxxhdpi/ic_launcher.png"

      - name: Set Manifest App Icon
        run: |
          MANIFEST=$(find "$PROJECT" \
            -name "AndroidManifest.xml" \
            -print -quit)

          if [ -z "$MANIFEST" ]; then
            echo "AndroidManifest.xml not found!"
            exit 1
          fi

          sed -i 's#android:icon="[^"]*"#android:icon="@mipmap/ic_launcher"#g' "$MANIFEST"

          sed -i 's#android:roundIcon="[^"]*"#android:roundIcon="@mipmap/ic_launcher"#g' "$MANIFEST"

          echo "Krushna AI launcher icon configured."

      - name: Add Internet Permission
        run: |
          MANIFEST=$(find "$PROJECT" \
            -name "AndroidManifest.xml" \
            -print -quit)

          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest/a\
            <uses-permission android:name="android.permission.INTERNET" />' \
            "$MANIFEST"
          fi

      - name: Add Microphone Permission
        run: |
          MANIFEST=$(find "$PROJECT" \
            -name "AndroidManifest.xml" \
            -print -quit)

          if ! grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST"; then
            sed -i '/<manifest/a\
            <uses-permission android:name="android.permission.RECORD_AUDIO" />' \
            "$MANIFEST"
          fi

      - name: Fix Layout
        run: |
          LAYOUT="$PROJECT/app/src/main/res/layout/activity_main.xml"

          if [ -f "$LAYOUT" ]; then
            sed -i 's/android:hintTextColor="[^"]*"//g' "$LAYOUT"
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: |
          cd "$PROJECT"
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "APK files:"
          find "$PROJECT" -type f -name "*.apk" -print

      - name: Upload Krushna AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Krushna-AI-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
