name: Build Krushna AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract
        run: unzip -o AI_Assistant_Basic.zip -d extracted

      - name: Find Project
        run: |
          PROJECT=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1 | xargs dirname)
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Copy MainActivity
        run: |
          mkdir -p "$PROJECT/app/src/main/java/com/example/aiassistant"
          cp MainActivity.java "$PROJECT/app/src/main/java/com/example/aiassistant/MainActivity.java"

      - name: Add Logo
        run: |
          mkdir -p "$PROJECT/app/src/main/res/drawable"
          cp file_0000000009b081fab0d7a8e0c41526ef.png "$PROJECT/app/src/main/res/drawable/krushna_ai_logo.png"

      - name: Fix layout
        run: |
          sed -i 's/android:hintTextColor="[^"]*"//g' "$PROJECT/app/src/main/res/layout/activity_main.xml"

      - name: Add Internet Permission
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          manifest = "$PROJECT/app/src/main/AndroidManifest.xml"
          tree = ET.parse(manifest)
          root = tree.getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          perm = "android.permission.INTERNET"
          existing = [
              x.get(ns + "name")
              for x in root.findall("uses-permission")
          ]
          if perm not in existing:
              e = ET.Element("uses-permission")
              e.set(ns + "name", perm)
              root.insert(0, e)
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          PY

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: |
          cd "$PROJECT"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Krushna-AI-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
