name: Build Krushna AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android Project
        run: |
          unzip -o Krishna_AI_Assistant_Advanced.zip -d extracted

      - name: Find Android Project
        run: |
          PROJECT=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -1 | xargs dirname)

          if [ -z "$PROJECT" ]; then
            echo "Android Gradle project not found!"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT"

      - name: Replace Actual MainActivity
        run: |
          TARGET=$(find "$PROJECT" -type f \
            -path "*/src/main/java/*" \
            -name "MainActivity.java" | head -1)

          if [ -z "$TARGET" ]; then
            echo "MainActivity.java not found!"
            exit 1
          fi

          echo "Replacing: $TARGET"
          cp MainActivity.java "$TARGET"

          if ! grep -q "handleCommand" "$TARGET"; then
            echo "New MainActivity was not copied!"
            exit 1
          fi

      - name: Add Logo
        run: |
          mkdir -p "$PROJECT/app/src/main/res/drawable"
          cp file_0000000009b081fab0d7a8e0c41526ef.png \
            "$PROJECT/app/src/main/res/drawable/krushna_ai_logo.png"

      - name: Setup Launcher Icon
        run: |
          RES="$PROJECT/app/src/main/res"

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          for DIR in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp file_0000000009b081fab0d7a8e0c41526ef.png \
              "$RES/mipmap-$DIR/ic_launcher.png"
          done

      - name: Fix Manifest
        run: |
          MANIFEST=$(find "$PROJECT" \
            -name AndroidManifest.xml -print -quit)

          if [ -z "$MANIFEST" ]; then
            echo "AndroidManifest.xml not found!"
            exit 1
          fi

          sed -i \
            's#android:icon="[^"]*"#android:icon="@mipmap/ic_launcher"#g' \
            "$MANIFEST"

          sed -i \
            's#android:roundIcon="[^"]*"#android:roundIcon="@mipmap/ic_launcher"#g' \
            "$MANIFEST"

          grep -q 'android.permission.INTERNET' "$MANIFEST" || \
            sed -i '/<manifest/a\
          <uses-permission android:name="android.permission.INTERNET" />' \
            "$MANIFEST"

          grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST" || \
            sed -i '/<manifest/a\
          <uses-permission android:name="android.permission.RECORD_AUDIO" />' \
            "$MANIFEST"

      - name: Fix Layout
        run: |
          LAYOUT="$PROJECT/app/src/main/res/layout/activity_main.xml"

          if [ -f "$LAYOUT" ]; then
            sed -i 's/android:hintTextColor="[^"]*"//g' "$LAYOUT"
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: |
          cd "$PROJECT"
          gradle assembleDebug --stacktrace

      - name: Verify Build
        run: |
          echo "Checking MainActivity..."
          grep -n "handleCommand" "$GITHUB_WORKSPACE"/MainActivity.java || true

          echo "Checking APK..."
          find "$PROJECT" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Krushna-AI-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
