name: Build Krushna AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android Project
        run: |
          unzip -o Krishna_AI_Assistant_Advanced.zip -d extracted

      - name: Find Android Project
        run: |
          PROJECT=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -1 | xargs dirname)

          if [ -z "$PROJECT" ]; then
            echo "Android Gradle project not found!"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT"

      - name: Add MainActivity
        run: |
          mkdir -p "$PROJECT/app/src/main/java/com/example/aiassistant"

          cp MainActivity.java \
            "$PROJECT/app/src/main/java/com/example/aiassistant/MainActivity.java"

      - name: Add VoiceService
        run: |
          mkdir -p "$PROJECT/app/src/main/java/com/example/aiassistant"

          cp VoiceService.java \
            "$PROJECT/app/src/main/java/com/example/aiassistant/VoiceService.java"

      - name: Create Krushna AI Layout
        run: |
          LAYOUT="$PROJECT/app/src/main/res/layout/activity_main.xml"

          mkdir -p "$(dirname "$LAYOUT")"

          cat > "$LAYOUT" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#FFFFFF"
              android:padding="16dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:gravity="center_vertical"
                  android:orientation="horizontal">

                  <TextView
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="Krushna AI"
                      android:textColor="#111111"
                      android:textSize="24sp"
                      android:textStyle="bold" />

                  <Button
                      android:id="@+id/settings"
                      android:layout_width="50dp"
                      android:layout_height="50dp"
                      android:text="⚙"
                      android:textSize="20sp" />

              </LinearLayout>

              <ImageView
                  android:id="@+id/logo"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="2"
                  android:src="@drawable/krushna_ai_logo"
                  android:scaleType="centerInside"
                  android:contentDescription="Krushna AI Logo" />

              <TextView
                  android:id="@+id/status"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:gravity="center"
                  android:text="Ready"
                  android:textColor="#555555"
                  android:textSize="18sp"
                  android:padding="8dp" />

              <TextView
                  android:id="@+id/chat"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="2"
                  android:padding="12dp"
                  android:textColor="#111111"
                  android:textSize="17sp"
                  android:gravity="top"
                  android:scrollbars="vertical" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center_vertical">

                  <Button
                      android:id="@+id/add"
                      android:layout_width="50dp"
                      android:layout_height="55dp"
                      android:text="+" />

                  <EditText
                      android:id="@+id/input"
                      android:layout_width="0dp"
                      android:layout_height="55dp"
                      android:layout_weight="1"
                      android:hint="Ask Krushna AI"
                      android:textColor="#111111"
                      android:textColorHint="#777777"
                      android:singleLine="true"
                      android:padding="12dp" />

                  <Button
                      android:id="@+id/mic"
                      android:layout_width="55dp"
                      android:layout_height="55dp"
                      android:text="🎙️"
                      android:textSize="20sp" />

                  <Button
                      android:id="@+id/send"
                      android:layout_width="55dp"
                      android:layout_height="55dp"
                      android:text="➤" />

              </LinearLayout>

          </LinearLayout>
          EOF

      - name: Add Permissions and Voice Service
        run: |
          MANIFEST=$(find "$PROJECT" -name AndroidManifest.xml -print -quit)

          sed -i '/<manifest/a\
          <uses-permission android:name="android.permission.INTERNET" />\
          <uses-permission android:name="android.permission.RECORD_AUDIO" />\
          <uses-permission android:name="android.permission.READ_CONTACTS" />\
          <uses-permission android:name="android.permission.CALL_PHONE" />\
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />' "$MANIFEST"

          sed -i '/<\/application>/i\
          <service\
              android:name=".VoiceService"\
              android:enabled="true"\
              android:exported="false"\
              android:foregroundServiceType="microphone" />' "$MANIFEST"

      - name: Add Krushna AI Logo
        run: |
          RES="$PROJECT/app/src/main/res"

          mkdir -p "$RES/drawable"
          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          cp file_0000000009b081fab0d7a8e0c41526ef.png \
            "$RES/drawable/krushna_ai_logo.png"

          cp file_0000000009b081fab0d7a8e0c41526ef.png \
            "$RES/mipmap-mdpi/ic_launcher.png"

          cp file_0000000009b081fab0d7a8e0c41526ef.png \
            "$RES/mipmap-hdpi/ic_launcher.png"

          cp file_0000000009b081fab0d7a8e0c41526ef.png \
            "$RES/mipmap-xhdpi/ic_launcher.png"

          cp file_0000000009b081fab0d7a8e0c41526ef.png \
            "$RES/mipmap-xxhdpi/ic_launcher.png"

          cp file_0000000009b081fab0d7a8e0c41526ef.png \
            "$RES/mipmap-xxxhdpi/ic_launcher.png"

      - name: Set Launcher Icon
        run: |
          MANIFEST=$(find "$PROJECT" -name AndroidManifest.xml -print -quit)

          sed -i 's#android:icon="[^"]*"#android:icon="@mipmap/ic_launcher"#g' "$MANIFEST"

          sed -i 's#android:roundIcon="[^"]*"#android:roundIcon="@mipmap/ic_launcher"#g' "$MANIFEST"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: |
          cd "$PROJECT"
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          find "$PROJECT" -type f -name "*.apk" -print

      - name: Upload Krushna AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Krushna-AI-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
